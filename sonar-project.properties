sonar.projectKey=dgunter_zeek-tds
sonar.organization=dgunter
sonar.projectName=zeek-tds
# Bump when a release should reset SonarCloud's "new code" baseline.
sonar.projectVersion=0.2

# Spicy grammar and Zeek scripts. Neither is a language Sonar analyses itself, so
# the CI job feeds it generic reports: btest results, Zeek script coverage from
# the script profiler, and formatter findings as external issues.
sonar.sources=analyzer,scripts
sonar.tests=testing/tests
sonar.test.inclusions=testing/tests/**
sonar.exclusions=testing/Baseline/**,testing/Traces/**,build/**
sonar.sourceEncoding=UTF-8

sonar.coverageReportPaths=testing/.tmp/sonar-coverage.xml
sonar.testExecutionReportPaths=testing/.tmp/sonar-tests.xml
sonar.externalIssuesReportPaths=testing/.tmp/sonar-issues.json
